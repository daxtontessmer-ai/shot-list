<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shot List">
<meta name="theme-color" content="#245A6B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Shot List</title>
<style>
:root{--bg:#EEF2F2;--card:#fff;--ink:#13212A;--muted:#5E6F76;--faint:#8A989D;--line:#D3DCDD;--sea:#245A6B;--sea-soft:#D9E8EC;--buoy:#D94F22;--ok:#2F7D4F}
@media (prefers-color-scheme:dark){:root{--bg:#0A1115;--card:#16232A;--ink:#E4ECEC;--muted:#9AAAB0;--faint:#6E8088;--line:#26363F;--sea:#7FB6C6;--sea-soft:#1C3440;--buoy:#F0693A;--ok:#6CC08C}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:10px}
h1{margin:0;font-size:28px;letter-spacing:-.01em}
.net{font-size:12px;font-weight:600;color:var(--faint);display:flex;gap:6px;align-items:center}
.net i{width:8px;height:8px;border-radius:50%;background:var(--ok)}.net.off i{background:var(--faint)}
.prog{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px}
.prog .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
.cat{margin-top:14px}
.cathead{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:transparent;padding:6px 2px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.vid{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:8px;overflow:hidden}
.vhead{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:13px 14px;text-align:left}
.vhead .t{flex:1;font-weight:650;font-size:16px}
.cnt{font-size:13px;color:var(--muted);font-weight:600}.cnt.all{color:var(--ok)}
.chev{color:var(--faint);transition:transform .15s}.open>.vhead .chev,.open>.cathead .chev{transform:rotate(90deg)}
.vbody{padding:0 14px 12px}
.desc{color:var(--muted);font-size:14px;margin:0 0 6px}
.ref{font-size:13px;color:var(--sea);word-break:break-all}
.scene{border-top:1px solid var(--line);padding:12px 0 10px}
.srow{display:flex;gap:10px;align-items:flex-start}
.box{width:30px;height:30px;flex:none;border-radius:8px;border:2px solid var(--faint);background:transparent;display:grid;place-items:center;color:#fff;font-size:16px;font-weight:700;padding:0}
.done .box{background:var(--ok);border-color:var(--ok)}
.what{flex:1;min-width:0;font-size:15px;padding:4px 0;white-space:pre-wrap;word-wrap:break-word}
.done .what{color:var(--faint);text-decoration:line-through}
.what:empty::before{content:"Tap to describe the shot";color:var(--faint)}
textarea.what{border:1px solid var(--sea);border-radius:8px;padding:6px 8px;background:var(--bg);resize:none;min-height:60px;outline:none;text-decoration:none}
.x{border:0;background:transparent;color:var(--faint);font-size:20px;padding:0 4px;line-height:1}
.x.arm{color:var(--buoy);font-size:12px;font-weight:700}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0 40px}
.pill{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:650;color:var(--faint);min-width:64px}
.pill.on{border:1px solid var(--sea);background:var(--sea);color:var(--card)}
.add{width:100%;margin-top:8px;border:1.5px dashed var(--line);background:transparent;border-radius:12px;padding:11px;font-weight:700;color:var(--sea)}
.vtools{display:flex;justify-content:space-between;margin-top:6px}
.link{border:0;background:transparent;color:var(--sea);font-weight:600;font-size:14px;padding:6px 0}
.link.red{color:var(--buoy)}
.newvid{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;margin-bottom:6px}
.newvid input,.newvid select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg)}
.btn{border:0;border-radius:999px;background:var(--sea);color:var(--card);font-weight:700;padding:12px}
.foot{margin-top:24px;display:grid;gap:8px}
.foot .row{display:flex;gap:8px}.foot .row>*{flex:1}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:11px;font-weight:600;text-align:center}
.note{font-size:12.5px;color:var(--faint);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:9}
</style>
</head>
<body>
<div class="app">
  <header><h1>Shot List</h1><span class="net" id="net"><i></i><span></span></span></header>
  <div class="prog" id="prog"></div>
  <button class="add" id="newVidBtn" style="margin:0 0 4px">+ New video</button>
  <div id="newVid"></div>
  <div id="list"></div>
  <div class="foot">
    <div class="row"><button class="ghost" id="backup">Save backup</button><label class="ghost">Restore backup<input type="file" id="restore" accept="application/json,.json" hidden></label></div>
    <p class="note">Everything saves on this phone and works with no signal. Save a backup now and then to keep a copy.</p>
  </div>
</div>
<div id="toast"></div>

const KEY = "shotlist.v1";
let data, open = new Set(), editing = null, armed = null;
try { data = JSON.parse(localStorage.getItem(KEY)); } catch {}
if (!data || !Array.isArray(data.cats)) data = {cats: SEED, savedAt: null};
try { open = new Set(JSON.parse(localStorage.getItem(KEY+".open") || "[]")); } catch {}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
// Two copies on the phone: localStorage (instant) + IndexedDB (backup copy).
const idb = () => new Promise((ok, no) => { const r = indexedDB.open("shotlist", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
async function idbPut(v){ try { const db = await idb(); db.transaction("kv","readwrite").objectStore("kv").put(v, KEY); } catch {} }
async function idbGet(){ try { const db = await idb(); return await new Promise(ok => { const q = db.transaction("kv").objectStore("kv").get(KEY); q.onsuccess = () => ok(q.result); q.onerror = () => ok(null); }); } catch { return null; } }
function save(){ data.savedAt = Date.now(); const j = JSON.stringify(data);
  try { localStorage.setItem(KEY, j); } catch { toast("Phone storage is full. Save a backup."); }
  idbPut(j); }
function saveOpen(){ try { localStorage.setItem(KEY+".open", JSON.stringify([...open])); } catch {} }
function toast(m){ $("#toast").innerHTML = `<div class="toast">${esc(m)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(()=>$("#toast").innerHTML="", 1800); }
const allVids = () => data.cats.flatMap(c => c.videos);
const findVid = id => allVids().find(v => v.id === id);

function render(){
  const sc = allVids().flatMap(v => v.scenes), done = sc.filter(s => s.done).length;
  $("#prog").innerHTML = `<div class="row"><span>${done} of ${sc.length} shots filmed</span><span>${allVids().filter(v=>v.scenes.length && v.scenes.every(s=>s.done)).length} videos done</span></div><div class="bar"><i style="width:${sc.length?Math.round(done/sc.length*100):0}%"></i></div>`;
  $("#list").innerHTML = data.cats.filter(c => c.videos.length).map(c => {
    const o = open.has("c:"+c.cat);
    return `<div class="cat ${o?"open":""}"><button class="cathead" data-cat="${esc(c.cat)}"><span>${esc(c.cat)} · ${c.videos.length}</span><span class="chev">›</span></button>
      ${o ? c.videos.map(vidHTML).join("") : ""}</div>`;
  }).join("");
  if (editing){ const t = document.getElementById("edit"); if (t){ t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }
}
function vidHTML(v){
  const o = open.has("v:"+v.id), d = v.scenes.filter(s=>s.done).length;
  return `<div class="vid ${o?"open":""}">
    <button class="vhead" data-vid="${v.id}"><span class="t">${esc(v.title)}</span><span class="cnt ${v.scenes.length&&d===v.scenes.length?"all":""}">${d}/${v.scenes.length}</span><span class="chev">›</span></button>
    ${o ? `<div class="vbody">
      ${v.desc ? `<p class="desc">${esc(v.desc)}</p>` : ""}
      ${v.ref ? `<div class="ref">Ref: ${esc(v.ref)}</div>` : ""}
      ${v.scenes.map((s,i) => sceneHTML(v,s,i)).join("")}
      <button class="add" data-addscene="${v.id}">+ Add scene</button>
      <div class="vtools"><span></span><button class="link red ${armed==="v:"+v.id?"arm":""}" data-delvid="${v.id}">${armed==="v:"+v.id?"Tap again to delete video":"Delete video"}</button></div>
    </div>` : ""}
  </div>`;
}
function sceneHTML(v,s,i){
  const key = v.id+"|"+s.id, ed = editing === key;
  return `<div class="scene ${s.done?"done":""}">
    <div class="srow">
      <button class="box" data-check="${key}" aria-label="Filmed">${s.done?"✓":""}</button>
      ${ed ? `<textarea class="what" id="edit" data-key="${key}" rows="3">${esc(s.what)}</textarea>`
           : `<div class="what" data-edit="${key}">${esc(s.what)}</div>`}
      <button class="x ${armed===key?"arm":""}" data-delscene="${key}" aria-label="Delete scene">${armed===key?"Delete?":"×"}</button>
    </div>
    <div class="pills">${PILLS.map(([label,opts],k) => `<button class="pill ${s.p[k]?"on":""}" data-pill="${key}|${k}">${esc(s.p[k] || label)}</button>`).join("")}</div>
  </div>`;
}
function sceneOf(key){ const [vid,sid] = key.split("|"); const v = findVid(vid); return [v, v?.scenes.find(s=>s.id===sid)]; }
function commitEdit(){
  const t = document.getElementById("edit"); if (!t) { editing = null; return; }
  const [, s] = sceneOf(t.dataset.key); if (s){ s.what = t.value.trim(); save(); }
  editing = null;
}

document.addEventListener("click", e => {
  const b = e.target.closest("button, [data-edit]"); if (!b) return;
  const d = b.dataset;
  if (editing && !b.closest("#edit")) commitEdit();
  if (!d.delscene && !d.delvid) armed = null;
  if (d.cat){ const k="c:"+d.cat; open.has(k)?open.delete(k):open.add(k); saveOpen(); }
  else if (d.vid){ const k="v:"+d.vid; open.has(k)?open.delete(k):open.add(k); saveOpen(); }
  else if (d.check){ const [,s]=sceneOf(d.check); s.done=!s.done; save(); if (s.done) toast("Got it ✓"); }
  else if (d.pill){ const [vid,sid,k]=d.pill.split("|"); const [,s]=sceneOf(vid+"|"+sid); const opts=PILLS[k][1]; const i=opts.indexOf(s.p[k]); s.p[k] = i===opts.length-1 ? "" : opts[i+1]; save(); }
  else if (d.edit){ editing = d.edit; }
  else if (d.addscene){ const v=findVid(d.addscene); const last=v.scenes[v.scenes.length-1]; const s={id:uid(),what:"",done:false,p:[last?.p[0]||"",last?.p[1]||"Video","","",""]}; v.scenes.push(s); save(); editing=v.id+"|"+s.id; }
  else if (d.delscene){ if (armed!==d.delscene){ armed=d.delscene; } else { const [v,s]=sceneOf(d.delscene); v.scenes=v.scenes.filter(x=>x!==s); armed=null; save(); toast("Scene deleted"); } }
  else if (d.delvid){ const k="v:"+d.delvid; if (armed!==k){ armed=k; } else { data.cats.forEach(c=>c.videos=c.videos.filter(v=>v.id!==d.delvid)); armed=null; save(); toast("Video deleted"); } }
  else return;
  render();
});
document.addEventListener("keydown", e => { if (e.target.id==="edit" && e.key==="Enter" && !e.shiftKey){ e.preventDefault(); commitEdit(); render(); } });
document.addEventListener("focusout", e => { if (e.target.id==="edit") setTimeout(()=>{ if (editing){ commitEdit(); render(); } }, 150); });

// new video
$("#newVidBtn").onclick = () => {
  if ($("#newVid").innerHTML){ $("#newVid").innerHTML=""; return; }
  $("#newVid").innerHTML = `<div class="newvid"><input id="nvTitle" placeholder="Video title" autocomplete="off">
    <select id="nvCat">${data.cats.map(c=>`<option>${esc(c.cat)}</option>`).join("")}<option value="__new">+ New category…</option></select>
    <input id="nvNewCat" placeholder="New category name" hidden>
    <button class="btn" id="nvAdd">Add video</button></div>`;
  $("#nvCat").onchange = () => $("#nvNewCat").hidden = $("#nvCat").value !== "__new";
  $("#nvAdd").onclick = () => {
    const title = $("#nvTitle").value.trim(); if (!title){ toast("Give it a title"); return; }
    let name = $("#nvCat").value; if (name==="__new") name = $("#nvNewCat").value.trim() || "Ideas";
    let cat = data.cats.find(c=>c.cat===name); if (!cat){ cat={cat:name,videos:[]}; data.cats.push(cat); }
    const v = {id:uid(), title, desc:"", ref:"", scenes:[{id:uid(),what:"",done:false,p:["Portrait","Video","","",""]}]};
    cat.videos.unshift(v); open.add("c:"+name); open.add("v:"+v.id); saveOpen(); save();
    $("#newVid").innerHTML = ""; editing = v.id+"|"+v.scenes[0].id; render(); toast("Video added");
  };
  $("#nvTitle").focus();
};

$("#backup").onclick = async () => {
  const name = `shot-list-backup-${new Date().toISOString().slice(0,10)}.json`;
  const blob = new Blob([JSON.stringify(data)], {type:"application/json"});
  const file = new File([blob], name, {type:"application/json"});
  try {
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:"Shot List backup"}); return; }
  } catch (e) { if (e.name==="AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
};
$("#restore").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (!Array.isArray(d.cats)) throw 0; data = d; save(); render(); toast("Backup restored"); }
  catch { toast("That file isn't a Shot List backup"); }
  e.target.value = "";
};

function net(){ const on = navigator.onLine; $("#net").className = "net"+(on?"":" off"); $("#net span").textContent = on ? "Online" : "Offline · still works"; }
addEventListener("online", net); addEventListener("offline", net); net();
render();
// If the quick copy was ever lost, bring back the backup copy.
idbGet().then(j => { try { const d = JSON.parse(j); if (d && Array.isArray(d.cats) && (d.savedAt||0) > (data.savedAt||0)) { data = d; localStorage.setItem(KEY, j); render(); } else if (data.savedAt) idbPut(JSON.stringify(data)); } catch {} });
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
addEventListener("pagehide", () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
</html>
